<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطای سرور داخلی - 500</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 400px;
        }

        h1 {
            font-size: 72px;
            color: #3b82f6; /* رنگ آبی */
        }

        h2 {
            font-size: 24px;
            margin: 16px 0;
        }

        p {
            margin: 12px 0;
            color: #555;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #4f46e5;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
        }

        a:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>500</h1>
        <h2>خطای سرور داخلی</h2>
        <p>مشکلی در سرور رخ داده است. لطفاً بعداً دوباره امتحان کنید.</p>
        <a href="/">بازگشت به صفحه اصلی</a>
    </div>
</body>
</html>
